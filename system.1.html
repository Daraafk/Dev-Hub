<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <title>Discord Kod Sida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 14px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            background-color: #f4f4f4;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Discord Kod Inmatning</h1>
    <p>Klistra in din Discord-kod nedan:</p>
    <textarea id="codeInput" placeholder="Skriv eller klistra in din kod här..."></textarea>
    <br>
    <button onclick="visaKod()">Visa Kod</button>
    <div id="output"></div>

    <script>
        function visaKod() {
            const kod = document.getElementById('codeInput').value;
            document.getElementById('output').textContent = kod;
        }
    </script>
</body>
</html>
